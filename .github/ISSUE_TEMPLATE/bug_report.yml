name: Bug report
description: Something in Rook doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rook version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent involved (if any)
      placeholder: Claude Code 2.x, Codex 0.x, ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, API keys, and private paths before pasting.

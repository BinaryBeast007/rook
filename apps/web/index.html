<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0e10" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Rook</title>
    <script src="./boot-theme.js"></script>
    <!-- Paints the boot shell before any CSS or script loads. Keep in sync with App.tsx. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--boot-canvas, #0e0e10);
      }

      #boot-shell {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        color: var(--boot-text, #f4f3ef);
      }

      #boot-shell svg {
        width: 64px;
        height: 64px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell" role="img" aria-label="Rook">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M10 4H22V12H28V4H36V12H42V4H54V20H10ZM18 24H46L54 60H10ZM29 34V48H35V34Z"
          />
        </svg>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
